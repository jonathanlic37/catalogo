# docker-compose.tls.yml — terminación TLS de la UI en https://localhost:8443.
#
#   ./scripts/gen-dev-cert.sh                  # certificado autofirmado en ./certs (no versionado)
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#
# La UI deja de publicarse por HTTP: solo queda el puerto TLS. El SPA se recompila con la URL de
# retorno OIDC en https (por eso --build al cambiar de modo). Keycloak sigue en http://localhost:8095:
# los navegadores tratan localhost como origen seguro; con un dominio real el IdP iría también tras TLS.
services:
  consumer-api:
    environment:
      # El navegador envía Origin https://localhost:8443 en las escrituras; el Consumer valida el origen.
      CORS_ALLOWED_ORIGINS: https://localhost:${TLS_PORT:-8443}
  frontend:
    build:
      args:
        VITE_OIDC_REDIRECT_URI: https://localhost:${TLS_PORT:-8443}/callback
    environment:
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    volumes:
      - ./frontend/nginx/tls.conf.template:/etc/nginx/templates/tls.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    ports: !override
      - "${FRONTEND_BIND:-127.0.0.1}:${TLS_PORT:-8443}:8443"
