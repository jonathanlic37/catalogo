# frontend/nginx/security-headers.conf
# Se incluye en el server y en cada location que use add_header (add_header no se hereda si el
# bloque hijo define el suyo). Fuentes y scripts son propios: no se permite ningún origen externo
# salvo el IdP ($oidc_origin, definido en default.conf.template a partir de OIDC_ORIGIN), necesario
# para el descubrimiento OIDC, el canje del código (connect-src) y el formulario de login (form-action).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' $oidc_origin; object-src 'none'; base-uri 'self'; form-action 'self' $oidc_origin; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
