# consumer-api/src/main/resources/application.yml
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: consumer-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      # relay del outbox, reconciliación, métricas y purga: cada tarea en su hilo para que una
      # reconciliación larga no retrase el reenvío de cambios pendientes.
      pool:
        size: 4
  datasource:
    url: jdbc:sqlite:${DB_PATH:./consumer.db}?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    # Validación estricta de lo que envía la UI: un campo desconocido es un 400. Las respuestas del
    # Producer se leen con DTOs tolerantes (@JsonIgnoreProperties en ProducerItem/ProducerPage).
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      # liveness: el proceso responde. readiness: además su BD SQLite está disponible. No depende
      # del Producer a propósito: con el Producer caído el Consumer sigue sirviendo su proyección y
      # encolando cambios en el outbox (degradación controlada en vez de fallo en cascada).
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  producer:
    base-url: ${PRODUCER_BASE_URL:http://localhost:8082}
    token: ${CONSUMER_TO_PRODUCER_TOKEN}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  # OAuth2/OIDC: issuer público (el que ve el navegador) y JWKS interno (el que alcanza el contenedor).
  oidc:
    issuer: ${OIDC_ISSUER:http://localhost:8095/realms/catalogo}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://auth:8080/realms/catalogo/protocol/openid-connect/certs}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088}
  sync:
    # Tope de rebases consecutivos con SYNC_CONFLICT_POLICY=CONSUMER_WINS. Los fallos transitorios
    # (Producer caído, 5xx, 408/429) NO tienen tope: se reintentan con backoff hasta confirmarse.
    max-retries: ${SYNC_MAX_RETRIES:5}
    retry-interval-ms: ${SYNC_RETRY_INTERVAL_MS:10000}
    reconcile-interval-ms: ${SYNC_RECONCILE_INTERVAL_MS:60000}
    # MANUAL | PRODUCER_WINS | CONSUMER_WINS
    conflict-policy: ${SYNC_CONFLICT_POLICY:MANUAL}
    metrics-interval-ms: ${SYNC_METRICS_INTERVAL_MS:15000}
    # Retención de eventos SENT del outbox (los FAILED se conservan para reintento/auditoría).
    outbox-retention-days: ${SYNC_OUTBOX_RETENTION_DAYS:7}
