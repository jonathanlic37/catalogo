# producer-api/src/main/resources/application.yml
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1024
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: producer-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        size: 2
  datasource:
    url: jdbc:sqlite:${DB_PATH:./producer.db}?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    # Validación estricta: un campo desconocido en el webhook o en la API de administración es un 400,
    # no se ignora en silencio (detecta desalineaciones de contrato y payloads manipulados).
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      # liveness: el proceso responde (reiniciar si falla). readiness: además la BD SQLite está
      # disponible (dejar de enviar tráfico si falla). Compose usa readiness para el orden de arranque.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  security:
    # Credencial del Consumer: solo webhook + lectura.
    consumer-token: ${CONSUMER_TO_PRODUCER_TOKEN}
    # Credencial de administración de la aplicación central: escritura directa + lectura + métricas.
    admin-token: ${PRODUCER_ADMIN_TOKEN}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088}
  idempotency:
    retention-days: ${IDEMPOTENCY_RETENTION_DAYS:7}
  backup:
    enabled: ${BACKUP_ENABLED:true}
    dir: ${BACKUP_DIR:./backups}
    interval-ms: ${BACKUP_INTERVAL_MS:21600000}
    initial-delay-ms: ${BACKUP_INITIAL_DELAY_MS:60000}
    keep: ${BACKUP_KEEP:8}
