name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Tests ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [producer-api, consumer-api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: ${{ matrix.module }}
        run: mvn -q -B test

  frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npx tsc --noEmit

  compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          sed -i "s/^CONSUMER_TO_PRODUCER_TOKEN=.*/CONSUMER_TO_PRODUCER_TOKEN=$(openssl rand -hex 32)/" .env
          sed -i "s/^FRONTEND_TO_CONSUMER_TOKEN=.*/FRONTEND_TO_CONSUMER_TOKEN=$(openssl rand -hex 32)/" .env
          docker compose config -q

  e2e:
    name: Smoke end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env
        run: |
          cp .env.example .env
          sed -i "s/^CONSUMER_TO_PRODUCER_TOKEN=.*/CONSUMER_TO_PRODUCER_TOKEN=$(openssl rand -hex 32)/" .env
          sed -i "s/^FRONTEND_TO_CONSUMER_TOKEN=.*/FRONTEND_TO_CONSUMER_TOKEN=$(openssl rand -hex 32)/" .env
      - name: Levantar el stack
        run: docker compose up -d --build
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Bajar el stack
        if: always()
        run: docker compose down -v
