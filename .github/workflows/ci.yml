name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Tests ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [producer-api, consumer-api]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: ${{ matrix.module }}
        run: mvn -q -B test

  frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run
      - run: npx tsc --noEmit

  compose:
    name: Validar docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.tls.yml config -q

  e2e:
    name: Smoke end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exactamente las instrucciones del README: el sistema debe arrancar desde cero con .env.example.
      - name: Preparar .env
        run: cp .env.example .env
      - name: Levantar el stack
        run: docker compose up -d --build
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      # E2E de navegador ligero: solo Chromium (sin la imagen Docker de Playwright).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: E2E de navegador (Playwright + Chromium)
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          set -a; source ../.env; set +a
          npx playwright test
      - name: Capturas y reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: |
            e2e/test-results/
            e2e/playwright-report/
      - name: Logs en caso de fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Bajar el stack
        if: always()
        run: docker compose down -v
