# docs/openapi/producer-api.yaml — especificación OpenAPI 3 de la Producer API (fuente de verdad).
# Escrita a partir del código (producer-api/src/main/java/.../web). Visualízala con docs/api.html.
openapi: 3.0.3
info:
  title: Producer API — Catálogo (fuente de verdad)
  version: 1.0.0
  license:
    name: Uso interno — prueba técnica
  description: |
    Aplicación central y **Single Source of Truth** del catálogo. Define el estado oficial de cada
    ítem: asigna versión y fechas, valida y aplica los cambios que llegan del Consumer por webhook y
    devuelve el estado aceptado.

    **Dos credenciales Bearer con privilegios distintos** (tokens estáticos, variables de entorno):

    | Credencial | Variable | Puede |
    |---|---|---|
    | Servicio (Consumer) | `CONSUMER_TO_PRODUCER_TOKEN` | Enviar el webhook y leer. **No** puede escribir directamente (403). |
    | Administración | `PRODUCER_ADMIN_TOKEN` | Leer, crear/editar/borrar directamente y ver métricas. **No** puede usar el webhook (403). |

    Los errores siguen RFC 7807 (`application/problem+json`) y nunca incluyen trazas.
servers:
  - url: http://localhost:8082
    description: Local (docker compose; solo 127.0.0.1)
tags:
  - name: Ítems
    description: Lectura autoritativa y administración directa de la fuente de verdad.
  - name: Webhook
    description: Entrada de los cambios del Consumer, idempotente y con control de versión.
  - name: Operación
    description: Healthchecks y métricas.
paths:
  /api/items:
    get:
      operationId: listarItems
      tags: [Ítems]
      summary: Lista paginada de ítems (orden estable por fecha de creación e id)
      description: La usa el Consumer para la reconciliación. Credencial de servicio o de administración.
      security: [{ servicio: [] }, { administracion: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, description: 'Se acota a 1..1000.', schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: Página de ítems.
          content: { application/json: { schema: { $ref: '#/components/schemas/PageItemResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: crearItemDirecto
      tags: [Ítems]
      summary: Crear un ítem directamente en la fuente de verdad
      description: El Producer asigna id, versión (1) y fechas. Solo credencial de administración.
      security: [{ administracion: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemRequest' } } }
      responses:
        '201':
          description: Ítem creado (estado canónico).
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: obtenerItem
      tags: [Ítems]
      summary: Obtener un ítem
      security: [{ servicio: [] }, { administracion: [] }]
      responses:
        '200':
          description: Estado canónico del ítem.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: editarItemDirecto
      tags: [Ítems]
      summary: Editar un ítem directamente
      description: Sube la versión en 1 y actualiza `fechaActualizacion`. Solo credencial de administración.
      security: [{ administracion: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ItemRequest' } } }
      responses:
        '200':
          description: Ítem actualizado.
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: eliminarItemDirecto
      tags: [Ítems]
      summary: Eliminar un ítem directamente (borrado físico)
      security: [{ administracion: [] }]
      responses:
        '204': { description: Eliminado. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/catalogo:
    post:
      operationId: recibirWebhook
      tags: [Webhook]
      summary: Recibir un cambio del Consumer (idempotente)
      description: |
        Aplica un alta, edición o borrado enviado por el Consumer. Solo credencial de servicio.

        - **Idempotencia:** la misma `Idempotency-Key` con el mismo contenido devuelve la respuesta
          original sin reaplicar (`Idempotent-Replayed: true`); con otro contenido → 409.
          También con entregas **simultáneas** de la misma clave: una sola se aplica y las demás
          reciben el replay (o 409 si el contenido difiere), nunca un 500.
        - **Versión:** si `baseVersion` no coincide con la versión actual → 409 y no se modifica nada
          (también en borrados).
        - **Fuera de orden:** un evento sin `baseVersion` con `occurredAt` anterior al último aplicado
          se descarta y se devuelve el estado actual.
      security: [{ servicio: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Identifica el intento (UUID). Se reutiliza en cada reintento del mismo cambio.
          schema: { type: string, maxLength: 100, example: 3f1c2b7a-9d4e-4c8a-a1f2-5e6d7c8b9a01 }
        - name: X-Event-Type
          in: header
          required: true
          schema: { $ref: '#/components/schemas/EventType' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
            examples:
              alta: { value: { id: 0b9e1c2a-1f4d-4b8e-9c3a-2d5f6a7b8c90, nombre: Café molido, descripcion: 500 g, estado: ACTIVO, tipo: PRODUCTO, occurredAt: '2026-01-01T00:00:00Z' } }
              edicion: { value: { id: 0b9e1c2a-1f4d-4b8e-9c3a-2d5f6a7b8c90, nombre: Café molido 1 kg, estado: ACTIVO, tipo: PRODUCTO, baseVersion: 1, occurredAt: '2026-01-02T00:00:00Z' } }
              borrado: { value: { id: 0b9e1c2a-1f4d-4b8e-9c3a-2d5f6a7b8c90, baseVersion: 2 } }
      responses:
        '200':
          description: Edición o borrado aplicado (o respuesta repetida de una clave ya procesada).
          headers: { Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } }
        '201':
          description: Alta aplicada (o respuesta repetida de una clave ya procesada).
          headers: { Idempotent-Replayed: { $ref: '#/components/headers/IdempotentReplayed' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/ItemResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Conflicto de versión, id ya existente o `Idempotency-Key` reutilizada con otro contenido.
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /actuator/health/liveness:
    get:
      operationId: liveness
      tags: [Operación]
      summary: Liveness (el proceso responde). Público.
      security: []
      responses: { '200': { $ref: '#/components/responses/Health' } }
  /actuator/health/readiness:
    get:
      operationId: readiness
      tags: [Operación]
      summary: Readiness (proceso + base de datos). Público; lo usa docker compose.
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { description: No listo (p. ej. base de datos no disponible). }
  /actuator/prometheus:
    get:
      operationId: metricas
      tags: [Operación]
      summary: Métricas en formato Prometheus. Solo credencial de administración.
      security: [{ administracion: [] }]
      responses:
        '200': { description: Métricas., content: { text/plain: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    servicio:
      type: http
      scheme: bearer
      description: '`CONSUMER_TO_PRODUCER_TOKEN` (rol SERVICE): webhook y lectura.'
    administracion:
      type: http
      scheme: bearer
      description: '`PRODUCER_ADMIN_TOKEN` (rol ADMIN): escritura directa, lectura y métricas.'
  headers:
    IdempotentReplayed:
      description: '`true` si la respuesta es la guardada de una entrega anterior con la misma clave.'
      schema: { type: string, enum: ['true', 'false'] }
  schemas:
    Estado: { type: string, enum: [ACTIVO, INACTIVO] }
    TipoContenido: { type: string, enum: [PRODUCTO, SERVICIO, CONTENIDO], description: Tipo de elemento de catálogo. }
    EventType: { type: string, enum: [CREATED, UPDATED, DELETED] }
    ItemRequest:
      type: object
      additionalProperties: false
      required: [nombre, estado]
      properties:
        nombre: { type: string, maxLength: 120, example: Café molido }
        descripcion: { type: string, maxLength: 1000, nullable: true, example: 500 g }
        estado: { $ref: '#/components/schemas/Estado' }
        tipo: { allOf: [{ $ref: '#/components/schemas/TipoContenido' }], description: 'Opcional; por defecto PRODUCTO.' }
    ItemResponse:
      type: object
      description: Estado canónico de un ítem (contrato contracts/item-response.json).
      required: [id, nombre, estado, tipo, fechaCreacion, fechaActualizacion, version]
      properties:
        id: { type: string, example: 0b9e1c2a-1f4d-4b8e-9c3a-2d5f6a7b8c90 }
        nombre: { type: string }
        descripcion: { type: string, nullable: true }
        estado: { $ref: '#/components/schemas/Estado' }
        tipo: { $ref: '#/components/schemas/TipoContenido' }
        fechaCreacion: { type: string, format: date-time }
        fechaActualizacion: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1, description: Sube en 1 con cada cambio aceptado. }
    WebhookPayload:
      type: object
      additionalProperties: false
      description: Cambio enviado por el Consumer (contrato contracts/webhook-created.json).
      required: [id]
      properties:
        id: { type: string, maxLength: 36, pattern: '^[A-Za-z0-9-]+$' }
        nombre: { type: string, maxLength: 120, description: Obligatorio en CREATED y UPDATED. }
        descripcion: { type: string, maxLength: 1000, nullable: true }
        estado: { $ref: '#/components/schemas/Estado' }
        tipo: { $ref: '#/components/schemas/TipoContenido' }
        baseVersion: { type: integer, format: int64, nullable: true, description: 'Versión en la que se basó el cambio; null en CREATED.' }
        occurredAt: { type: string, format: date-time, nullable: true, description: Momento del cambio; ordena eventos sin versión. }
    PageItemResponse:
      type: object
      required: [content, page, size, totalElements, totalPages, last]
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/ItemResponse' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        last: { type: boolean }
    Problem:
      type: object
      description: Error RFC 7807, sin trazas.
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, example: 400 }
        detail: { type: string, example: Datos de entrada inválidos }
        instance: { type: string, example: /webhooks/catalogo }
        errors:
          type: object
          description: Solo en validación; error por campo.
          additionalProperties: { type: string }
          example: { nombre: size must be between 0 and 120 }
  responses:
    BadRequest:
      description: Datos de entrada inválidos, cabecera ausente o campo desconocido.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Sin Bearer o token inválido.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: La credencial no tiene permiso para esta operación.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Ítem no encontrado.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UnsupportedMediaType:
      description: El cuerpo debe ser application/json.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Health:
      description: Estado del servicio.
      content: { application/json: { schema: { type: object, properties: { status: { type: string, example: UP } } } } }
security:
  - servicio: []
  - administracion: []
