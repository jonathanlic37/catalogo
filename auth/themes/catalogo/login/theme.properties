# auth/themes/catalogo/login/theme.properties
# Tema de login «DAKA Glass» para Keycloak: hereda la estructura y accesibilidad de keycloak.v2
# (PatternFly 5) y solo sustituye la capa visual con daka.css (paleta, cristal, tipografía).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/daka.css
# La paleta DAKA se muestra en claro: se desactiva el modo oscuro automático de PatternFly para
# que no mezcle sus propios colores con los del tema.
darkMode=false
